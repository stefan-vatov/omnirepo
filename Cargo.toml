categories = ["command-line-utilities"]

[workspace]
members = ["tools/omnirepo-dev", "tools/omnirepo-test-support"]
resolver = "3"

[workspace.package]
authors = ["Stefan Vatov"]
edition = "2024"
license = "MIT"
repository = "https://github.com/stefan-vatov/omnirepo"
rust-version = "1.86"

[workspace.lints.clippy]
all = "warn"

[workspace.lints.rust]
warnings = "warn"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2.2.2"
cargo_metadata = "0.23.1"
predicates = "3.1.4"
serde = { version = "1.0.229", features = ["derive"] }
syn = { version = "3.0.3", default-features = false, features = ["full", "parsing", "visit"] }
tempfile = "3.27.0"
toml_edit = { version = "0.25.13", default-features = false, features = ["parse"] }
yaml_serde = "0.10.5"

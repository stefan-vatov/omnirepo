[alias]
fmt-check = "fmt --all -- --check"
lint = "clippy --workspace --all-targets --all-features --locked -- -D warnings"
test-all = "test --workspace --all-targets --all-features --locked"
test-docs = "test --workspace --doc --all-features --locked"
build-all = "build --workspace --all-targets --all-features --locked"
coverage = "llvm-cov --workspace --all-targets --all-features --locked --summary-only --fail-under-lines 95 --fail-under-functions 80 --fail-under-regions 80"
coverage-html = "llvm-cov --workspace --all-targets --all-features --locked --html --output-dir coverage"

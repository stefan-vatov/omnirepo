name: Release

on:
  push:
    branches: [main]

jobs:
  build_linux:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -C link-arg=-Wl,--as-needed
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-unknown-linux-gnu
    - name: Format
      run: cargo fmt --all -- --check
    - name: Lint
      run: cargo clippy --locked --all-targets --all-features -- -D warnings
    - name: Test
      run: cargo test --locked --all-targets --all-features
    - name: Build
      run: cargo build --locked --release --all-features --target x86_64-unknown-linux-gnu
    - name: Upload release binary
      uses: actions/upload-artifact@v7
      with:
        name: x86_64-unknown-linux-gnu
        path: target/x86_64-unknown-linux-gnu/release/omnirepo

  build_universal:
    runs-on: macos-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
    - name: Add targets
      run: |
        rustup target add x86_64-apple-darwin
        rustup target add aarch64-apple-darwin
    - name: Format
      run: cargo fmt --all -- --check
    - name: Lint
      run: cargo clippy --locked --all-targets --all-features -- -D warnings
    - name: Test
      run: cargo test --locked --all-targets --all-features
    - name: Build
      run: |
        cargo build --locked --release --all-features --target x86_64-apple-darwin
        cargo build --locked --release --all-features --target aarch64-apple-darwin
    - name: Create universal binary
      run: |
        mkdir -p target/universal/release
        lipo -create -output target/universal/release/omnirepo \
            target/x86_64-apple-darwin/release/omnirepo \
            target/aarch64-apple-darwin/release/omnirepo
    - name: Upload release binary
      uses: actions/upload-artifact@v7
      with:
        name: universal-darwin
        path: target/universal/release/omnirepo

  create_release:
    runs-on: ubuntu-latest
    needs: [build_linux, build_universal]
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Get latest tag
      id: latest_tag
      run: |
        git fetch --depth=1 origin +refs/tags/*:refs/tags/*
        latest_version="$(
          git tag --list \
            | sed -nE 's/^v?([0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?)$/\1/p' \
            | sort -V \
            | tail -n 1
        )"
        if [[ -z "$latest_version" ]]; then
          echo "No semantic-version tag found." >&2
          exit 1
        fi
        echo "tag=v$latest_version" >> "$GITHUB_OUTPUT"
    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.latest_tag.outputs.tag }}
        name: Release ${{ steps.latest_tag.outputs.tag }}
        draft: false
        prerelease: false

    - name: Download Linux binary
      uses: actions/download-artifact@v8
      with:
        name: x86_64-unknown-linux-gnu
        path: release/linux

    - name: Download universal binary
      uses: actions/download-artifact@v8
      with:
        name: universal-darwin
        path: release/dar

    - name: Rename release binaries
      run: |
        mv release/linux/omnirepo release/linux/omnirepo-x86_64-unknown-linux-gnu
        mv release/dar/omnirepo release/dar/omnirepo-universal-darwin
    - name: Upload release binaries
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.latest_tag.outputs.tag }}
        files: |
          release/linux/omnirepo-x86_64-unknown-linux-gnu
          release/dar/omnirepo-universal-darwin

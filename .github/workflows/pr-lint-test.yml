name: lint & test

on:
  push:
    branches:
      - main
      - staging
      - trying
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: repository quality manifest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check 'pre-commit==4.3.0'

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2.9.2

      - name: Run aggregate quality manifest
        run: >-
          cargo run --quiet --locked
          --manifest-path tools/omnirepo-dev/Cargo.toml -- quality
          --manifest scripts/quality-manifest.json --repo-root .
          --profile stable --json

      - name: Run the repository test suite (CI/local equivalence)
        run: >-
          cargo run --quiet --locked
          --manifest-path tools/omnirepo-dev/Cargo.toml -- test
          --manifest scripts/test-suite-manifest.json --repo-root .
          --full --jobs 2 --artifacts target/omnirepo-test-artifacts --json
        env:
          RUSTFLAGS: "-D warnings"

      - name: Surface failing case logs
        if: failure()
        run: >-
          find target/omnirepo-test-artifacts -type f -path '*/cases/*' -name '*.log'
          -exec sh -c 'echo "===== {} ====="; cat "{}"' \;
        shell: bash

  msrv:
    name: repository quality manifest on Rust 1.86 MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install Rust 1.86
        uses: dtolnay/rust-toolchain@1.86.0

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2.9.2

      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check 'pre-commit==4.3.0'

      - name: Run aggregate quality manifest on the MSRV
        run: >-
          cargo run --quiet --locked
          --manifest-path tools/omnirepo-dev/Cargo.toml -- quality
          --manifest scripts/quality-manifest.json --repo-root .
          --profile msrv --json

  macos-quality:
    name: repository quality manifest on macOS (APFS)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install Rust 1.86
        uses: dtolnay/rust-toolchain@1.86.0

      - name: Cache Rust build artifacts (isolated per OS)
        uses: Swatinem/rust-cache@v2.9.2

      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check 'pre-commit==4.3.0'

      - name: Run aggregate quality manifest on macOS
        run: >-
          cargo run --quiet --locked
          --manifest-path tools/omnirepo-dev/Cargo.toml -- quality
          --manifest scripts/quality-manifest.json --repo-root .
          --profile msrv --json

      - name: Run the repository test suite on macOS
        run: >-
          cargo run --quiet --locked
          --manifest-path tools/omnirepo-dev/Cargo.toml -- test
          --manifest scripts/test-suite-manifest.json --repo-root .
          --full --jobs 2 --artifacts target/omnirepo-test-artifacts --json
        env:
          RUSTFLAGS: "-D warnings"

      - name: Surface failing case logs
        if: failure()
        run: >-
          find target/omnirepo-test-artifacts -type f -path '*/cases/*' -name '*.log'
          -exec sh -c 'echo "===== {} ====="; cat "{}"' \;
        shell: bash

  arm64-containment:
    name: containment on arm64 Linux
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2.9.2

      # `O_NOFOLLOW` and `O_DIRECTORY` hold different bit patterns on the arm
      # family than on the asm-generic architectures. A wrong value never
      # fails loudly: the open silently follows the symlink it was supposed
      # to refuse, so the containment guarantee disappears on arm64 while
      # x86_64 stays green. This job is the only thing that observes that.
      # `release_platform` builds the shipped x86_64 bundle rather than
      # exercising containment, so it is the one documented exclusion.
      # Several tests execute the built binary at `target/debug/omnirepo`,
      # which `cargo test --bin` does not produce on its own.
      - name: Build the product binary
        run: cargo build --locked --bin omnirepo

      - name: Run the product test suite on arm64
        run: cargo test --bin omnirepo --locked -- --skip release_platform
        env:
          RUSTFLAGS: "-D warnings"

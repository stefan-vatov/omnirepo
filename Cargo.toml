[package]
name = "omnirepo"
version = "0.8.3"
edition = "2024"
rust-version = "1.86"
authors = ["Stefan Vatov"]
license = "MIT"
description = "A command-line tool for managing multiple Git repositories."
repository = "https://github.com/stefan-vatov/omnirepo"
readme = "README.md"
keywords =["repository", "cli", "terminal"]
exclude = [
    "target",
    ".cargo",
    ".cargo_vcs_info.json",
    ".gitignore",
    ".pre-commit-config.yaml",
    "AGENTS.md",
    "CLAUDE.md",
    "tools/omnirepo-dev",
    "tools/omnirepo-test-support",
    ".beads",
    ".claude",
    ".codex",
    ".github",
    "canon",
    "docs",
    "scripts",
    "coverage",
    "tests",
    "src/configuration/unit_tests.rs",
    "src/configuration/discovery_tests.rs",
    "src/configuration/yaml_subset_tests.rs",
    "src/managed_content/transaction_tests.rs",
    "src/managed_content/compare_tests.rs",
    "src/source/acquisition_tests.rs",
    "src/source/publish_tests.rs",
    "src/source/snapshot_tests.rs",
    "src/repository/capture_tests.rs",
    "src/repository/git_index_tests.rs",
    "src/repository/manifest_tests.rs",
    "src/repository/operation_commit_tests.rs",
    "src/repository/operation_tree_tests.rs",
    "src/repository/policy_loader_tests.rs",
    "src/repository/policy_tests.rs",
    "src/repository/state_tests.rs",
    "src/platform/authority/tests.rs",
    "src/platform/authority/tests/",
    "src/lifecycle/event/event_tests.rs",
    "src/lifecycle/journal/journal_tests.rs",
    "src/lifecycle/replay/replay_tests.rs",
    "src/lifecycle/admission/admission_tests.rs",
    "src/source/acquisition/acquisition_concurrency_tests.rs",
    "src/source/declarations_tests.rs",
    "src/lifecycle/nested_permits/nested_permits_tests.rs",
    "src/lifecycle/remote_push/remote_push_tests.rs",
    "src/lifecycle/source_extraction/source_extraction_tests.rs",
    "src/source/extraction_tests.rs",
    "src/lifecycle/scheduler/scheduler_tests.rs",
    "src/lifecycle/push_reconcile/push_reconcile_tests.rs",
    "src/source/item_resolution_tests.rs",
    "src/lifecycle/nested_permits/fairness_tests.rs",
    "src/lifecycle/remote_push/remote_push_fixture_tests.rs",
    "src/source/catalog_state_tests.rs",
    "src/lifecycle/nested_permits/saturation_tests.rs",
    "src/source/catalog_fixture_tests.rs",
    "src/lifecycle/source_catalog/source_catalog_tests.rs",
    "src/lifecycle/remote_target/remote_target_tests.rs",
    "src/lifecycle/fleet_permits/fleet_permits_tests.rs",
    "src/lifecycle/adapters/adapters_hostile_tests.rs",
    "src/lifecycle/admission/admission_concurrency_tests.rs",
    "src/lifecycle/agent_confinement/agent_confinement_tests.rs",
    "src/lifecycle/agent_runtime/agent_runtime_tests.rs",
    "src/lifecycle/cancellation/cancellation_tests.rs",
    "src/lifecycle/commit_journal/commit_journal_fixture_tests.rs",
    "src/lifecycle/agent_framing/agent_framing_tests.rs",
    "src/lifecycle/commit_journal/commit_journal_tests.rs",
    "src/lifecycle/stages/stages_tests.rs",
    "src/lifecycle/agent_framing/agent_framing_tests.rs",
    "src/lifecycle/adapters/adapters_tests.rs",
    "src/lifecycle/replace/replace_tests.rs",
    "src/lifecycle/transaction_evidence/transaction_evidence_tests.rs",
    "src/lifecycle/run_record/run_record_tests.rs",
    "cog.toml",
    "Cargo.toml.orig",
]
categories = ["command-line-utilities"]

[workspace]
members = ["tools/omnirepo-dev", "tools/omnirepo-test-support"]
resolver = "3"

[workspace.package]
authors = ["Stefan Vatov"]
edition = "2024"
license = "MIT"
repository = "https://github.com/stefan-vatov/omnirepo"
rust-version = "1.86"

[workspace.lints.clippy]
all = "warn"

[workspace.lints.rust]
warnings = "warn"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2.2.2"
cargo_metadata = "0.23.1"
predicates = "3.1.4"
serde = { version = "1.0.229", features = ["derive"] }
syn = { version = "3.0.3", default-features = false, features = ["full", "parsing", "visit"] }
tempfile = "3.27.0"
toml_edit = { version = "0.25.13", default-features = false, features = ["parse"] }
yaml_serde = "0.10.5"

[package]
name = "omnirepo"
version = "0.8.3"
edition = "2024"
rust-version = "1.86"
authors = ["Stefan Vatov"]
license = "MIT"
description = "A command-line tool for managing multiple Git repositories."
repository = "https://github.com/stefan-vatov/omnirepo"
readme = "README.md"
keywords =["repository", "cli", "terminal"]
exclude = ["target", "Cargo.lock"]
categories = ["command-line-utilities"]

[[bin]]
name = "omnirepo"
path = "src/bin/main.rs"

[lib]
name = "omnirepo_lib"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
dirs = "6.0.0"
duct = "1.1.1"
indicatif = { version = "0.18.6", features = ["rayon"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
yaml_serde = "0.10.5"
reqwest = { version = "0.13.4", features = ["json", "blocking"] }
fern = "0.7.1"
log = "0.4.33"
prettytable-rs = "0.10.0"
once_cell = "1.21.4"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
proptest = "1.11.0"
tempfile = "3.27.0"

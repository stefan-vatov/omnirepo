---

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-added-large-files
  - id: check-case-conflict
  - id: check-json
  - id: pretty-format-json
  - id: check-merge-conflict
  - id: check-symlinks
  - id: check-toml
  - id: check-yaml
  - id: detect-private-key
  - id: end-of-file-fixer
  - id: sort-simple-yaml
  - id: trailing-whitespace

- repo: local
  hooks:
  - id: validate-beads-decisions
    name: validate Beads decision workflow
    entry: .beads/validate-decisions.sh
    language: system
    pass_filenames: false

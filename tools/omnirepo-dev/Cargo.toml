[package]
name = "omnirepo-dev"
version = "0.1.0"
publish = false
description = "Private developer tooling for maintaining the omnirepo repository."
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "omnirepo_dev"
path = "src/lib.rs"

[[bin]]
name = "omnirepo-dev"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
omnirepo-test-support = { path = "../omnirepo-test-support" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"

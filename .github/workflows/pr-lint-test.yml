name: lint & test

on:
  push:
    branches:
      - main
      - staging
      - trying
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: format, lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2.9.2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: >-
          cargo clippy --workspace --all-targets --all-features --locked --
          -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Run documentation tests
        run: cargo test --workspace --doc --all-features --locked

      - name: Build all targets
        run: cargo build --workspace --all-targets --all-features --locked

  msrv:
    name: test Rust 1.86 MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install Rust 1.86
        uses: dtolnay/rust-toolchain@1.86.0

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2.9.2

      - name: Run all target tests on the MSRV
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Run documentation tests on the MSRV
        run: cargo test --workspace --doc --all-features --locked

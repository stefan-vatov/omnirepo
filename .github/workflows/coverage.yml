name: coverage

on:
  push:
    branches:
      - main
      - staging
      - trying
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: measure coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      # Explicit fail-closed changed-line comparison base: the PR base commit,
      # the previous push commit on main, or empty (the coverage script then
      # fails closed rather than inventing a sample).
      OMNIREPO_COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          # The changed-line gate diffs against the explicit base commit; a
          # shallow checkout cannot resolve it.
          fetch-depth: 0

      - name: Verify coverage workflow contract
        run: bash tests/coverage_workflow_contract.sh

      - name: Verify Linux authority filesystem capability
        run: bash tests/authority_capability.sh linux-filesystem

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: llvm-tools-preview

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2.9.2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2.85.11
        with:
          tool: cargo-llvm-cov@0.8.7
          fallback: none

      - name: Run manifest-owned coverage profile
        run: >-
          cargo run --quiet --locked
          --manifest-path tools/omnirepo-dev/Cargo.toml -- quality
          --manifest scripts/quality-manifest.json --repo-root .
          --profile coverage --json

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-reports
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  platform-authority:
    name: authority platform (${{ matrix.expected }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            expected: linux-filesystem
          - os: macos-latest
            expected: macos-apfs
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Install Rust 1.86
        uses: dtolnay/rust-toolchain@1.86.0
      - name: Verify authority filesystem capability
        run: bash tests/authority_capability.sh "${{ matrix.expected }}"

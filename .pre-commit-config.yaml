---

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-added-large-files
  - id: check-case-conflict
  - id: check-json
  - id: pretty-format-json
    # The traceability matrix rows are a compact one-row-per-line test
    # contract (traceability_contract.rs matches `{"id":...` line prefixes);
    # expanding or sorting them would break the byte-level fixtures.
    exclude: ^tests/traceability/matrix\.json$
  - id: check-merge-conflict
  - id: check-symlinks
  - id: check-toml
  - id: detect-private-key
  - id: sort-simple-yaml

- repo: local
  hooks:
  - id: validate-beads-decisions
    name: validate Beads decision workflow
    entry: scripts/cargo-pinned 1.95.0 run --quiet --locked --manifest-path tools/omnirepo-dev/Cargo.toml -- validate-decisions
    language: system
    pass_filenames: false
  - id: test-beads-decisions
    name: test Beads decision workflow
    entry: scripts/cargo-pinned 1.95.0 test --quiet --locked --manifest-path tools/omnirepo-dev/Cargo.toml --test beads_validator_contract
    language: system
    pass_filenames: false
  - id: checked-agent-plan
    name: checked autonomous Beads plan
    entry: scripts/cargo-pinned 1.95.0 run --quiet --locked --manifest-path tools/omnirepo-dev/Cargo.toml -- plan --repo-root . --json
    language: system
    pass_filenames: false
  - id: test-checked-agent-plan
    name: test checked autonomous Beads plan
    entry: scripts/cargo-pinned 1.95.0 test --quiet --locked --manifest-path tools/omnirepo-dev/Cargo.toml --test planner_contract
    language: system
    pass_filenames: false
